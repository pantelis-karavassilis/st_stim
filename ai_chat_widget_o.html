<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Assistant</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#fff}
#hp-study-wrap{font-family:Arial,sans-serif;font-size:14px;color:#333;background:#fff;border:1px solid #ccc;max-width:100%}
#hp-study-wrap .hp-top{border-bottom:2px solid #0076d1;padding:14px 20px;font-size:15px;font-weight:bold}
#hp-study-wrap .hp-chat-win{margin:0 20px;border:1px solid #ccc;border-bottom:none;height:440px;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
#hp-study-wrap .hp-msg-row{display:flex;flex-direction:column;gap:3px}
#hp-study-wrap .hp-msg-row.user{align-items:flex-end}
#hp-study-wrap .hp-msg-row.ai{align-items:flex-start}
#hp-study-wrap .hp-msg-lbl{font-size:11px;color:#888}
#hp-study-wrap .hp-bubble{max-width:82%;padding:9px 13px;font-size:14px;line-height:1.6;border:1px solid #ccc;background:#fff;color:#333;white-space:pre-wrap}
#hp-study-wrap .hp-msg-row.user .hp-bubble{background:#e8f0fb;border-color:#b3c9ef}
#hp-study-wrap .hp-typing-row{display:none;flex-direction:column;gap:3px}
#hp-study-wrap .hp-typing-row.visible{display:flex}
#hp-study-wrap .hp-typing-dots{border:1px solid #ccc;background:#fff;padding:10px 14px;display:flex;gap:5px;align-items:center;width:fit-content}
#hp-study-wrap .hp-dot{width:6px;height:6px;border-radius:50%;background:#aaa;animation:hpblink 1.2s infinite}
#hp-study-wrap .hp-dot:nth-child(2){animation-delay:.2s}
#hp-study-wrap .hp-dot:nth-child(3){animation-delay:.4s}
@keyframes hpblink{0%,80%,100%{opacity:.3}40%{opacity:1}}
#hp-study-wrap .hp-input-area{padding:12px 20px 16px;margin:0 20px;display:flex;gap:8px;align-items:flex-end;border:1px solid #ccc;border-top:1px solid #e0e0e0}
#hp-study-wrap .hp-textarea{flex:1;border:1px solid #aaa;padding:8px 10px;font-family:Arial,sans-serif;font-size:14px;color:#333;resize:none;outline:none;min-height:40px;max-height:100px}
#hp-study-wrap .hp-textarea:focus{border-color:#0076d1}
#hp-study-wrap .hp-send-btn{background:#0076d1;color:#fff;border:none;padding:9px 18px;font-size:14px;cursor:pointer;height:40px}
#hp-study-wrap .hp-send-btn:hover{background:#005fa3}
#hp-study-wrap .hp-send-btn:disabled{background:#aaa;cursor:not-allowed}
</style>
</head>
<body>
<div id="hp-study-wrap">
  <div class="hp-top">AI Assistant</div>
  <div class="hp-chat-win" id="hp-chat-win">
    <div class="hp-msg-row ai">
      <div class="hp-msg-lbl">Assistant</div>
      <div class="hp-bubble">What can I help you with today?</div>
    </div>
    <div class="hp-typing-row" id="hp-typing-row">
      <div class="hp-msg-lbl">Assistant</div>
      <div class="hp-typing-dots">
        <div class="hp-dot">&nbsp;</div>
        <div class="hp-dot">&nbsp;</div>
        <div class="hp-dot">&nbsp;</div>
      </div>
    </div>
  </div>
  <div class="hp-input-area">
    <textarea class="hp-textarea" id="hp-textarea" placeholder="Type your message here..." rows="1"></textarea>
    <button class="hp-send-btn" id="hp-send-btn" onclick="hpSend()">Send</button>
  </div>
</div>

<script>
var PROXY_URL   = 'https://hp-proxy.vercel.app/api/chat';


var HP_SP = "You are a helpful AI assistant supporting someone who is choosing a pair of wireless headphones. You answer questions based ONLY on the information provided in the sources below. Do not use any outside knowledge about headphones or audio products.\n\nRULES:\n- Only use information from the provided sources\n- If something is not covered by the sources, say: \"I don't have information on that in my sources\"\n- Be conversational and natural \u2014 like a knowledgeable friend helping someone think through a decision\n- Present tradeoffs factually and conversationally. You may use natural language including evaluative terms where appropriate.\n- Do not recommend a single product unprompted. Present options with factual tradeoffs\n- If the person explicitly asks you to pick one, suggest 1-2 options that match their stated criteria, framed as \"based on what you described\"\n- Do not mention that you are part of a research study\n- Do not mention website names or source names unless asked\n- Do not include image references in your responses\n\n--- SOURCE: Wirecutter ---\nHow to choose the best headphones for you Best wireless over-ear headphones Best wireless earbuds Best noise-cancelling over-ear headphones Best noise-cancelling earbuds Best bone-conduction headphones Best open-ear headphones Best wireless TV headphones Best workout headphones Best running headphones Best kids headphones Best wired over-ear headphones under $150 Best wired earbuds under $200 Best wireless over-ear headphones under $100 Best wireless earbuds under $50 Best wired earbuds under $30 Best audiophile headphones for everyday use What to look forward to\n\n--- SOURCE: TechRadar ---\nTo create this list of the best headphones we assessed every pair for comfort, sound quality, smart features, battery life, value for money and more, pitting each model against its closest competitors. We know that picking the right headphones amongst a sea of options can feel overwhelming. That's why we've done the hard work for you, narrowing the choice down to the very best headphones you can buy right now. I've reviewed over 150 audio products since becoming a tech journalist, ranging from super-budget earbuds to high-end Hi-Res Audio music players. \u2705 You want industry-leading ANC: These headphones deliver best-in-class noise cancelling, rivalling even Bose's top models. Whether it's urban noise, appliances, or office chatter, they effectively mute the outside world. \u2705 You value advanced features: With LDAC, DSEE Extreme, adaptive ANC, customizable EQ, and spatial audio support, these headphones are built for serious audio fans. \u274c You're trying to keep costs down: These are premium headphones with a premium price. For something more affordable, look at Sony WH-1000XM4 at #7 on the list or the OneOdio Focus A6 at #2 on the list. \u274c You need extended battery life: 30 hours per charge is respectable, but not standout. Competing models like the Cambridge Audio Melomania P100 at #6 offer three times as much. \u2705 You want class-leading ANC: Bose has long been a leader in terms of noise-nixing and these headphones truly deliver. \u2705 You want comfort and practicality: They're incredibly comfortable to wear, look slick and fold up, making them portable, too. \u274c You want hi-res audio support: You can use a wired connection for high-quality sound, but if you're looking for aptX or USB digital Hi-Res Audio certification, the QuietComfort Ultra won't deliver. \u274c You want marathon battery life: At 24 hours, battery life is decent. But it falls well short of rivals, which can offer more than double the time these days.\n\n--- SOURCE: CNET ---\nI've tested hundreds of headphones for CNET. These are my current top over-ear and in-ear picks, from swanky premium options that cost $800 to value budget models that cost under $100. Over the last several years, Sony has made some of the best noise-canceling headphones on the market. With the XM6, Sony has fixed the small design flaws of its predecessor while bumping up the overall performance. The result is a headphone that's arguably edged just ahead of the competition and is now at the top of its class. Upgraded design with more comfortable fit. Improved noise canceling and sound quality. New QN3 chip is seven times as powerful as QN1 chip in XM5. Excellent voice-calling performance with more mics. Improved transparency mode. Spatial audio with head tracking. $50 more than previous model. No USB-C audio. Lightweight, comfortable design with dual-hinges that fold both up and flat. Superb noise canceling that rivals Sony's for ANC on the market. Slightly improved sound quality with new immersive-audio Cinema Mode. USB-C audio. Excellent voice-calling performance with minimal background noise. Intuitive mix of physical buttons and touch controls. Pricey. Immersive audio mode hurts battery life (30 to 24 hours).\n\n--- SOURCE: Wired ---\nThe best headphones are now so varied that they often depend entirely on what you intend to use them for. That means the best headphones for you probably come in many shapes and sizes, and you might actually want more than one pair. Noise-canceling earbuds are the ultimate jack-of-all-trades. If you only want to own one pair, this is it. The best noise-canceling earbuds sound great, fit neatly in your pocket, and are equally adept at letting in or blocking out environmental sounds. The wildly popular AirPods Pro are the best headphones for iPhone owners, thanks to impressive performance, loads of features, and seamless integration with all things Apple. For more phone-agnostic options, Bose's QuietComfort Ultra 2 are the ultimate noise killers, while Sony's new WF-1000XM6 offer great sound and utterly natural transparency mode. Sony WH-1000XM6 $460. Anyone who's taken a long flight can probably relate to the fact that sticking something in your ears for five hours-plus isn't an exercise in comfort. Enter travel headphones like the best noise-canceling over-ears. The latest and greatest, like Sony's WH-1000XM6 and Bose's QuietComfort Ultra, represent the current pinnacle of noise canceling.\n\n--- SOURCE: Eneba ---\nSony WH-1000XM6 \u2013 The best headphones overall. Whether you're looking for something to use for gaming, mixing audio, or just listening to music, the Sony WH-1000XM6 is the top pick for a variety of uses. It has best-in-class noise canceling tech, as well as a speedy 3.5 hour charge time. JBL Tune 520BT \u2013 If you're on a budget but still value quality, then the JBL Tune 520BT are a top pick. You'll lose noise cancellation but trade it for up to 57 hours of battery life, which is great for long trips. Bose New QuietComfort Ultra \u2013 If noise canceling is essential, the Bose New QuietComfort Ultra headphones are the pick of the bunch. Specs: Battery Life Up to 30 hours (ANC on), up to 40 hours (ANC off). Noise Cancellation Yes. Bluetooth Version 5.3. Weight 254g. Microphone Yes. Charging Time 3.5 hours. The Sony WH-1000XM6 earns its reputation as one of the best headphones because it excels in every area that matters: ANC, sound quality, comfort, connectivity, and day-to-day usability. Its adaptive noise-canceling system is among the most effective available. I picked the Sony WH-1000XM6 for its class-leading noise cancellation and refined audio quality paired with the convenient foldable design.\n\n--- SOURCE: Audiophileon ---\nIf you come here wanting to know what headphones have the best sound quality, then the Focal Utopia should be the first place you look if your budget can extend this far. Detail retrieval is jaw-dropping, and the soundstage is massive, providing a speaker-like presentation to the sound. They are light and incredibly well-built. These will be out of reach for most headphone enthusiasts at a shade under four grand. Nonetheless, they are a stunning achievement from the French manufacturer. The Sony MDR-Z1R is a surprising take on high-end headphones \u2014 closed-back instead of open-back, making them more versatile. Massive 70mm dynamic drivers deliver powerful, deep bass.\n\n--- SOURCE: GearLab ---\nBose QuietComfort Ultra are our favorite pair of headphones, with great sound, exceptional comfort, and noise cancellation that creates a concert-like experience. If your budget is smaller, the 1More SonoFlow can save you significantly with good sound, comfort, and noise cancellation. The Apple AirPods Pro 3 and the Google Pixel Buds Pro 2 offer immersive sound, a stable fit, and excellent noise cancellation. Our lead tester said: \"The 2nd Gen is an exceptional headphone that does everything well.\" Their improved active noise cancellation and stellar phone call clarity combine with their sound to create headphones that do it all and do it well. If impressive noise cancellation is your primary goal, with comfort for hours and the ability to listen to high-quality sound, these should make your shortlist. We love how Sennheiser's audio pedigree shines through in the Momentum 4 headphone's signature rich, detailed sound. The noise cancellation is decent for daily use, and its marathon battery life lets you listen for days without worrying about recharging. If you're looking for one of the best-sounding, noise-cancelling headphones on the market and appreciate long listening sessions, the Momentum 4 will not disappoint.\n\n--- SOURCE: PCMag ---\nHeadphones and earphones come in a wide variety of sizes and shapes, offering a range of features and sound signatures. Finding the right pair for you requires weighing your preferred style, desired features, chosen listening environment, and budget. If you're looking for the top wireless audiophile headphones, consider the Sony WH-1000XM6. For most Apple users, we recommend the AirPods Pro 3. Sony WH-1000XM5 Wireless Noise Canceling Headphones \u2014 $248 ($399). Sennheiser Momentum 4 Wireless ANC Over-Ear Headphones \u2014 $222 ($449). Sonos Ace Wireless Noise Cancellation Over-Ear Headphones \u2014 $299 ($399). Sony WH-1000XM6 Wireless Noise Cancelling Over-Ear Headphones \u2014 $428 ($459). Over-ear headphones typically provide a more immersive experience than on-ear headphones. Plenty of on-ear models sound amazing and can even offer some passive noise isolation. The sonic advantage of wired headphones remains quite significant, even as Bluetooth audio has improved dramatically in recent years. If sound quality is important to you and you want to go wireless, ensure your headphones support the right high-end Bluetooth codecs that work with your phone, such as AAC and LDAC, rather than relying on the lower-quality SBC codec.\n\n--- SOURCE: SoundGuys ---\nThe best headphones in 2026 balance sound, comfort, and features for your lifestyle, not just specs. Whether you need powerful noise canceling for travel, open-back neutrality for critical listening, or budget-friendly wireless that just works, there's a pair that fits your use case and budget. We've tested more than 400 pairs of headphones in our lab. For most people in 2026, the Sony WH-1000XM6 is the best wireless headphone overall, combining class-leading ANC, customizable sound, and long battery life in a comfortable, travel-friendly design. If you want great ANC, good mic quality, and support for high-quality codecs like LDAC, SBC, AAC, and LC3, this is the model to beat. Battery life exceeds 37 hours with ANC on. The sound is slightly bass-heavy out of the box, but you can tune it with Sony's app. Comfort is generally solid, though the ear pads can feel a bit shallow for some head shapes.\n\n--- SOURCE: Rtings ---\nThe Sony WH-1000XM6 are the best headphones we've tested. Thanks to their powerful ANC tech and passive isolation, these over-ear headphones filter out a massive array of environmental noise. With ANC enabled, their battery lasts just shy of 32 hours. You can access high-quality codecs like LDAC and LC3. They support two-device Bluetooth multi-pairing with automatic switching. These premium-built headphones can fold down smaller for storage in the included hard case. Their cushy earpads and headband feel comfortable for most people. If you have larger ears or wear glasses, you might prefer the Bose QuietComfort Ultra Headphones (2nd Gen) for their roomier and more consistent fit. The Bose also support the high-quality aptX codec, but some features aren't as customizable, relying on a 3-band in-app graphic EQ compared to the Sony's 10-band one.\n";
var HP_MSGS  = [];
var HP_START = Date.now();
var HP_SID   = 'P_' + Math.random().toString(36).substr(2, 8).toUpperCase();
var HP_BUSY  = false;



var _btn = document.getElementById('hp-send-btn');
var _inp = document.getElementById('hp-textarea');

// Attach event listeners properly (not inline) to avoid triggering send on resize
_inp.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    hpSend();
  }
});
_inp.addEventListener('input', function() {
  _inp.style.height = 'auto';
  _inp.style.height = Math.min(_inp.scrollHeight, 100) + 'px';
});

function hpElapsed() { return Math.round((Date.now() - HP_START) / 1000); }

function hpAppend(role, text) {
  var win    = document.getElementById('hp-chat-win');
  var typing = document.getElementById('hp-typing-row');
  var row    = document.createElement('div');
  row.className = 'hp-msg-row ' + role;
  var lbl = document.createElement('div');
  lbl.className   = 'hp-msg-lbl';
  lbl.textContent = role === 'user' ? 'You' : 'Assistant';
  var bub = document.createElement('div');
  bub.className   = 'hp-bubble';
  bub.textContent = text;
  row.appendChild(lbl);
  row.appendChild(bub);
  win.insertBefore(row, typing);
  win.scrollTop = win.scrollHeight;
}

function hpSaveToQualtrics() {
  try {
    var transcript = HP_MSGS.map(function(m) {
      return '[' + (m.role === 'user' ? 'USER' : 'ASST') + ' +' + m.elapsed + 's] ' + m.content;
    }).join('\n');
    var userMsgs = HP_MSGS.filter(function(m) { return m.role === 'user'; }).length;

    // postMessage sends data to the Qualtrics parent page across the iframe boundary
    window.parent.postMessage({
      type:            'hp_chat_log',
      hp_messages_sent:  userMsgs,
      hp_total_time_sec: hpElapsed(),
      hp_transcript:     transcript.substring(0, 20000),
      hp_session_id:     HP_SID,
      hp_condition:      'AI'
    }, '*');
  } catch(e) {}
}

async function hpSend() {
  if (HP_BUSY || !HP_SP) return;
  var inp  = document.getElementById('hp-textarea');
  var btn  = document.getElementById('hp-send-btn');
  var text = inp ? inp.value.trim() : '';
  if (!text) return;

  HP_BUSY = true;
  HP_MSGS.push({ role: 'user', content: text, elapsed: hpElapsed() });
  hpAppend('user', text);
  inp.value = '';
  inp.style.height = 'auto';
  if (btn) btn.disabled = true;
  if (inp) inp.disabled = true;

  var tr = document.getElementById('hp-typing-row');
  if (tr) tr.className = 'hp-typing-row visible';
  document.getElementById('hp-chat-win').scrollTop = 99999;

  try {
    var apiMsgs = HP_MSGS.map(function(m) {
      return { role: m.role, content: m.content };
    });
    var resp = await fetch(PROXY_URL, {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model:      'claude-sonnet-4-20250514',
        max_tokens: 1000,
        system:     HP_SP,
        messages:   apiMsgs
      })
    });

    var data = await resp.json();
    if (!resp.ok) {
      if (tr) tr.className = 'hp-typing-row';
      hpAppend('ai', 'API error ' + resp.status + ': ' + JSON.stringify(data));
      return;
    }
    if (!data.content || !data.content[0]) {
      if (tr) tr.className = 'hp-typing-row';
      hpAppend('ai', 'Unexpected response: ' + JSON.stringify(data));
      return;
    }

    var reply = data.content[0].text;
    HP_MSGS.push({ role: 'assistant', content: reply, elapsed: hpElapsed() });
    if (tr) tr.className = 'hp-typing-row';
    hpAppend('ai', reply);
    hpSaveToQualtrics();

  } catch(e) {
    if (tr) tr.className = 'hp-typing-row';
    hpAppend('ai', 'Error: ' + e.message);
  } finally {
    HP_BUSY = false;
    if (btn) btn.disabled = false;
    if (inp) inp.disabled = false;
    if (inp) inp.focus();
  }
}

window.addEventListener('beforeunload', hpSaveToQualtrics);
setInterval(hpSaveToQualtrics, 30000);
</script>
</body>
</html>
